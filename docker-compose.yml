services:
  app:
    build: .
    container_name: ai-operations-assistant
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - operations_data:/app/data
      - ./data/knowledge_base:/app/data/knowledge_base:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  operations_data:
